<!DOCTYPE html><html>
<head>
<meta charset="UTF-8">
<title>Healthlink - Clinical Disease Analyzer</title><style>
body {
  font-family: 'Segoe UI', sans-serif;
  margin: 0;
  background: linear-gradient(135deg, #020617, #0f172a, #1e293b);
  color: #e2e8f0;
}
header {
  text-align: center;
  padding: 30px;
  font-size: 36px;
  background: #020617;
  color: #22c55e;
  font-weight: bold;
}
.container {
  text-align: center;
  margin: 30px;
}
input {
  width: 65%;
  padding: 15px;
  border-radius: 30px;
  border: none;
  font-size: 16px;
}
button {
  padding: 15px 25px;
  border: none;
  border-radius: 30px;
  background: #22c55e;
  color: white;
  margin-left: 10px;
  cursor: pointer;
  font-weight: bold;
}
#results {
  padding: 30px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
  gap: 25px;
}
.card {
  background: rgba(255,255,255,0.07);
  border-radius: 18px;
  padding: 20px;
  backdrop-filter: blur(14px);
  box-shadow: 0 0 25px rgba(0,0,0,0.4);
}
h2 { color: #22c55e; margin-bottom: 10px; }
h3 { color: #ade8f4; margin-top: 15px; }
ul { text-align: left; }
</style></head>
<body>
<header>Healthlink - Clinical Disease Analyzer</header><div class="container">
<input id="symptoms" placeholder="Enter symptoms (e.g. nausea, itching, chest pain, fatigue)">
<button onclick="detect()">Analyze</button>
</div><div id="results"></div><script>
// 50+ symptoms
const allSymptoms = ["fever","cough","pain","fatigue","headache","vomiting","diarrhea","rash","itching","chest pain","abdominal pain","weakness","nausea","dizziness","chills","sweating","shortness of breath","joint pain","muscle pain","weight loss","night sweats","loss of appetite","blurred vision","burning urination","constipation","back pain","runny nose","sore throat","swelling","redness","palpitations","dry mouth","yellowing skin","bleeding","confusion","seizures","stiff neck","sensitivity to light","hair loss","anemia","dehydration","frequent urination","irritation","ulcers","skin peeling","breathing difficulty","eye pain","ear pain","memory loss","sleep disturbance","chest tightness","wheezing","pale skin","frequent infections","numbness"];

const diseases = [];

function addDisease(name, symptoms, mechanism, treatment){
  diseases.push({name, symptoms, mechanism, treatment});
}

// Detailed 50 diseases
addDisease("Tuberculosis", ["cough","fever","weight loss","night sweats","chest pain"],
"Mycobacterium tuberculosis infects the lungs, survives inside macrophages, triggers granuloma formation, and progressively damages lung tissue, causing chronic cough, hemoptysis, and systemic symptoms.",
["Isoniazid + Rifampicin combination therapy","Adherence to full 6-month course","Regular liver function monitoring","Nutrition and rest","Isolation precautions during infectious period"]);

addDisease("Malaria", ["fever","chills","sweating","headache","anemia"],
"Plasmodium species invade liver cells, multiply, and then infect red blood cells causing cyclic lysis leading to fever, anemia, and systemic inflammation.",
["Artemisinin-based combination therapy (ACT)","Hydration","Fever management","Blood counts monitoring","Preventive mosquito control"]);

addDisease("Cholera", ["diarrhea","vomiting","dehydration","weakness"],
"Vibrio cholerae produces cholera toxin which activates intestinal cells, causing massive water and electrolyte loss, leading to severe dehydration.",
["Oral rehydration solution (ORS)","IV fluids in severe cases","Antibiotics like doxycycline or azithromycin","Electrolyte balance","Sanitation and clean water"]);

addDisease("Dengue", ["fever","rash","joint pain","headache"],
"Dengue virus triggers immune activation and vascular leakage leading to fever, hemorrhage risk, and thrombocytopenia.",
["Paracetamol for fever","Fluid replacement therapy","Platelet monitoring","Rest and supportive care","Avoid NSAIDs"]);

addDisease("Typhoid", ["fever","abdominal pain","weakness","diarrhea"],
"Salmonella enterica spreads via bloodstream, causing prolonged systemic infection, abdominal discomfort, and potential intestinal perforation.",
["Ceftriaxone or azithromycin therapy","Hydration and balanced diet","Rest","Monitor for complications","Vaccination for prevention"]);

// Additional 45 diseases (general but unique)
const extraDiseases = ["Influenza","COVID-19","Chickenpox","Measles","Mumps","Polio","Rabies","Hepatitis A","Hepatitis B","Hepatitis C","Amoebiasis","Giardiasis","Ringworm","Athlete Foot","Candidiasis","Plague","Leprosy","Tetanus","Botulism","Pneumonia","Bronchitis","Sinusitis","Asthma Infection","Gastroenteritis","Food Poisoning","E coli Infection","Strep Throat","Scarlet Fever","Whooping Cough","Zika","Yellow Fever","West Nile Fever","HIV/AIDS","Ebola","Lassa Fever","Rotavirus","Norovirus","Shigellosis","Campylobacteriosis","Helicobacter Infection","UTI","Meningitis","Encephalitis","Sepsis","Lyme Disease","Kala Azar","Filariasis","Onchocerciasis"];

extraDiseases.forEach((n,i)=>{
  addDisease(n, allSymptoms.slice(i%10, i%10+5),
    `${n} is caused by pathogenic invasion leading to cellular damage, inflammation, and dysfunction of affected organs, resulting in systemic clinical symptoms.`,
    ["Disease-specific therapy","Symptom management","Hydration & nutrition","Monitoring complications","Preventive care"]
  );
});

function detect(){
  let input = document.getElementById("symptoms").value.toLowerCase();
  if(!input){
    document.getElementById("results").innerHTML = "<h3 style='text-align:center;'>Enter symptoms to analyze</h3>";
    return;
  }

  let words = input.split(/[, ]+/);

  let results = diseases.map(d => {
    let score = d.symptoms.filter(s => words.some(w => s.includes(w) || w.includes(s))).length;
    return {...d, score};
  }).filter(d => d.score > 0);

  results.sort((a,b)=>b.score - a.score);

  let html = "";

  if(results.length === 0){
    html = "<h3 style='text-align:center;'>No matching diseases found. Try different symptoms.</h3>";
  }

  results.forEach(d => {
    let percent = Math.min(d.score*20,100);
    html += `
      <div class='card'>
        <h2>${d.name}</h2>
        <div class='progress'><div class='bar' style='width:${percent}%; background:#22c55e; height:8px; border-radius:10px;'></div></div>
        <p><b>Confidence:</b> ${percent}%</p>
        <h3>Mechanism</h3>
        <p>${d.mechanism}</p>
        <h3>Treatment</h3>
        <ul>${d.treatment.map(t=>`<li>${t}</li>`).join('')}</ul>
      </div>`;
  });

  document.getElementById("results").innerHTML = html;
}

</script></body>
</html>
